<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개발관리 대시보드 — 화성형 팔란티어</title>
  <style>
    :root { --brand: #2e6ff2; --ink: #121314; --muted: #6b7280; --line: #e5e7eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink); background: #fff; line-height: 1.6;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 19px 16px; max-width: 1190px; margin: 0 auto;
      display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 1.25rem; margin: 0 auto 0 0; font-weight: 600; }
    header a { color: var(--brand); text-decoration: none; font-size: .95rem; }
    header a:hover { text-decoration: underline; }
    main { max-width: 1190px; margin: 0 auto; padding: 48px 16px; }
    .placeholder {
      border: 1px dashed var(--line); border-radius: 12px;
      padding: 48px 24px; text-align: center; background: #fafafa;
    }
    .placeholder h2 { margin: 0 0 8px; font-size: 1.4rem; }
    .placeholder p { margin: 4px 0; color: var(--muted); }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
  </style>
</head>
<body>
  <header>
    <h1>개발관리 대시보드</h1>
    <a href="/">← 개발일지로 돌아가기</a>
  </header>
  <main>
    <div class="placeholder">
      <h2>대시보드 준비 중</h2>
      <p>이 페이지는 자리표시자입니다.</p>
      <p>완성된 대시보드 HTML로 저장소 루트의 <code>dashboard.html</code>을 덮어쓰면 됩니다.</p>
    </div>
  </main>
</body>
</html>
