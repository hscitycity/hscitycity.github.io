<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/icon/favicon.svg" type="image/x-icon" />
    <title>화성형 팔란티어 개발일지</title>

    <!-- 웹폰트: 본문/UI = Pretendard, 워드마크/글제목 = Paperlogy -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css"
    />

    <!-- marked -->
    <script src="./library/marked.min.js"></script>

    <!-- hightlight.js -->
    <link rel="stylesheet" href="./library/highlight_default.min.css" />
    <script src="./library/highlight_highlight.min.js"></script>
    <link rel="stylesheet" href="./library/highlight_ally-light.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href=" style/style.css" />

    <!-- GoatCounter: 일간/월간/연간 방문자 통계 -->
    <script
      data-goatcounter="https://hscitycity.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>

    <!-- tailwind -->
    <script src="./library/tailwind-3.4.1.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2e6ff2",
              background: "#fff",
              surface: "#121314",
              graylv1: "#f3f5fa",
              graylv2: "#d9dbe0",
              graylv3: "#8d9299",
              graylv4: "#47494d",
              error: "#ff3440",
              lowError: "#ffc533",
              activation: "#dee8ff",
            },
          },
        },
      };
    </script>
    <!-- // tailwind -->

    <style>
      @keyframes slideDown {
        from {
          transition: all 1s;
          height: 0px;
          opacity: 0;
        }
        to {
          opacity: 1;
          height: 60px;
        }
      }
      .markdown-cell > ul > li > p {
        display: inline-block;
      }
      /* ================= 폰트 ================= */
      :root {
        --font-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      body {
        font-family: "Pretendard Variable", Pretendard, var(--font-fallback);
      }
      .wordmark,
      .wordmark-top,
      .paperlogy-title {
        font-family: "Paperlogy", var(--font-fallback);
      }

      /* ============ 헤더: 상단바 + 이미지 하단 오버레이 메뉴 ============ */
      :root {
        --hdr-bg: #ffffff;
        --hdr-ink: #121314;
        --hdr-muted: #8d9299;
        --hdr-line: rgba(18, 19, 20, 0.12);
        --hdr-hover: #f3f5fa;
        --hdr-primary: #2e6ff2;
        --hdr-maxw: 1190px;
        --ov-ink: #ffffff;
        --ov-muted: rgba(255, 255, 255, 0.78);
        --ov-line: rgba(255, 255, 255, 0.32);
        --ov-hover: rgba(255, 255, 255, 0.16);
      }

      /* 1) 상단 유틸리티 바 (방문자 통계 + 햄버거), sticky */
      .top-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--hdr-bg);
        border-bottom: 0.5px solid var(--hdr-line);
      }
      .top-bar-inner {
        max-width: var(--hdr-maxw);
        margin: 0 auto;
        padding: 8px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .wordmark-top {
        font-size: 40px;
        font-weight: 500;
        line-height: 1.1;
        color: var(--hdr-ink);
        white-space: nowrap;
        cursor: pointer;
        letter-spacing: -0.5px;
      }
      .top-bar-right {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }
      .visitor-stats {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--hdr-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .visitor-stats strong {
        color: var(--hdr-ink);
        font-weight: 700;
      }
      .hamburger-btn {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .hamburger-btn:hover {
        background: var(--hdr-hover);
      }
      .hamburger-lines {
        display: inline-flex;
        flex-direction: column;
        gap: 4px;
        width: 20px;
      }
      .hamburger-lines span {
        display: block;
        height: 2px;
        width: 100%;
        background: var(--hdr-ink);
        border-radius: 2px;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .hamburger-btn[aria-expanded="true"] .hamburger-lines span:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }
      .hamburger-btn[aria-expanded="true"] .hamburger-lines span:nth-child(2) {
        opacity: 0;
      }
      .hamburger-btn[aria-expanded="true"] .hamburger-lines span:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }

      /* 읽기 진행선 (상단바 하단) */
      .hdr-progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 0%;
        background: var(--hdr-primary);
        transition: width 0.1s linear;
      }

      /* 햄버거 드롭다운 메뉴 */
      .menu-drawer {
        position: fixed;
        top: 48px;
        right: 16px;
        z-index: 60;
        background: var(--hdr-bg);
        border: 0.5px solid var(--hdr-line);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(10, 22, 40, 0.16);
        padding: 8px;
        display: flex;
        flex-direction: column;
        min-width: 200px;
      }
      .menu-drawer[hidden] {
        display: none;
      }
      .drawer-link {
        font-size: 17px;
        font-weight: 600;
        color: var(--hdr-ink);
        text-decoration: none;
        text-align: left;
        font-family: inherit;
        padding: 10px 14px;
        border-radius: 8px;
        background: transparent;
        border: none;
        cursor: pointer;
      }
      .drawer-link:hover {
        background: var(--hdr-hover);
      }

      /* 2) 히어로 이미지 + 하단 오버레이 메뉴바 */
      .hero-banner {
        position: relative;
        width: 100%;
        background: #0a1628;
        line-height: 0;
      }
      .hero-banner img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 420px;
        object-fit: cover;
        object-position: center;
      }
      .hero-banner::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 140px;
        background: linear-gradient(
          180deg,
          rgba(10, 22, 40, 0) 0%,
          rgba(10, 22, 40, 0.78) 100%
        );
        pointer-events: none;
        z-index: 1;
      }
      .hero-menubar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        line-height: normal;
        max-width: var(--hdr-maxw);
        margin: 0 auto;
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }
      .hero-menubar .hdr-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .hero-menubar .hdr-mark {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--ov-ink);
        color: #0a1628;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .hero-menubar .hdr-mark svg {
        width: 15px;
        height: 15px;
      }
      .hero-menubar .wordmark {
        font-size: 21px;
        font-weight: 500;
        color: var(--ov-ink);
        white-space: nowrap;
        cursor: pointer;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
      }
      .hero-menubar .hdr-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .hero-menubar .hdr-link {
        position: relative;
        font-size: 18px;
        color: var(--ov-muted);
        text-decoration: none;
        white-space: nowrap;
        transition: color 0.2s ease;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      }
      .hero-menubar .hdr-link:hover {
        color: var(--ov-ink);
      }
      .hero-menubar .hdr-link.is-current {
        color: var(--ov-ink);
        font-weight: 500;
      }
      .hero-menubar .hdr-link.is-current::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -6px;
        height: 2px;
        background: var(--ov-ink);
      }
      .hero-menubar .hdr-iconbtn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: var(--ov-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .hero-menubar .hdr-iconbtn:hover {
        background: var(--ov-hover);
      }
      .hero-menubar .hdr-iconbtn svg {
        width: 18px;
        height: 18px;
      }
      .hero-menubar .hdr-divider {
        width: 0.5px;
        height: 20px;
        background: var(--ov-line);
        flex-shrink: 0;
      }
      .hero-menubar .hdr-dashboard-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 18px;
        color: var(--ov-ink);
        text-decoration: none;
        border: 0.5px solid var(--ov-line);
        border-radius: 8px;
        padding: 6px 12px;
        transition: background 0.2s ease;
      }
      .hero-menubar .hdr-dashboard-btn:hover {
        background: var(--ov-hover);
      }
      .hero-menubar .hdr-dashboard-btn svg {
        width: 15px;
        height: 15px;
      }

      /* 검색 패널 (우상단 드롭다운) */
      .hdr-search-panel {
        position: fixed;
        top: 48px;
        right: 16px;
        z-index: 60;
        background: var(--hdr-bg);
        border: 0.5px solid var(--hdr-line);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(10, 22, 40, 0.16);
        padding: 10px;
        width: min(320px, calc(100vw - 32px));
      }
      .hdr-search-panel[hidden] {
        display: none;
      }
      .hdr-search-inner {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .hdr-search-panel input {
        flex: 1;
        height: 40px;
        border: 0.5px solid var(--hdr-line);
        border-radius: 8px;
        padding: 0 14px;
        font-size: 15px;
        color: var(--hdr-ink);
        background: var(--hdr-bg);
        outline: none;
      }
      .hdr-search-panel input:focus {
        border-color: var(--hdr-primary);
      }
      .hdr-search-panel .hdr-iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        color: var(--hdr-ink);
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        cursor: pointer;
      }
      .hdr-search-panel .hdr-iconbtn:hover {
        background: var(--hdr-hover);
      }

      /* 맨 위로 이동 버튼 (FAB) */
      .scroll-top-fab {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 55;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        background: var(--hdr-primary);
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(46, 111, 242, 0.4);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .scroll-top-fab[hidden] {
        display: none;
      }
      .scroll-top-fab.show {
        opacity: 1;
        transform: translateY(0);
      }
      .scroll-top-fab:hover {
        background: #245fd0;
      }
      .scroll-top-fab svg {
        width: 20px;
        height: 20px;
      }

      /* 접근성: 포커스 링 유지 */
      .hdr-link:focus-visible,
      .hdr-iconbtn:focus-visible,
      .hdr-dashboard-btn:focus-visible,
      .wordmark:focus-visible,
      .wordmark-top:focus-visible,
      .scroll-top-fab:focus-visible,
      .hamburger-btn:focus-visible,
      .drawer-link:focus-visible,
      .hdr-search-panel input:focus-visible {
        outline: 2px solid var(--hdr-primary);
        outline-offset: 2px;
      }

      /* 모바일 (<768px): 오버레이 링크 숨기고 햄버거로 접근 */
      @media (max-width: 767px) {
        .top-bar-inner {
          padding: 6px 16px;
        }
        .wordmark-top {
          font-size: 24px;
        }
        .visitor-stats {
          display: none;
        }
        .visitor-stats {
          font-size: 11px;
          gap: 8px;
        }
        .hero-menubar {
          padding: 12px 16px;
        }
        .hero-menubar .wordmark {
          font-size: 18px;
        }
        .hero-menubar .hdr-link,
        .hero-menubar .hdr-divider,
        .hero-menubar .hdr-dashboard-btn {
          display: none;
        }
      }

      /* 모션 최소화 */
      @media (prefers-reduced-motion: reduce) {
        .top-bar,
        .hero-menubar,
        .hdr-link,
        .hdr-iconbtn,
        .hdr-dashboard-btn,
        .hdr-progress,
        .hamburger-lines span,
        .scroll-top-fab {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="w-full text-surface">
    <!-- ① 상단 유틸리티 바: 제목(좌) + 방문자 통계 + 햄버거(우), sticky -->
    <div id="top-bar" class="top-bar">
      <div class="top-bar-inner">
        <span id="blog-title" class="wordmark-top" role="link" tabindex="0"
          >화성형 팔란티어 개발일지</span
        >
        <div class="top-bar-right">
          <div id="visitor-stats" class="visitor-stats">
            <span>일간 방문자수 <strong id="stat-daily">-</strong>명</span>
            <span>월간 방문자수 <strong id="stat-monthly">-</strong>명</span>
            <span>누적 방문자수 <strong id="stat-total">-</strong>명</span>
          </div>
          <button
            id="hamburger-btn"
            class="hamburger-btn"
            type="button"
            aria-label="메뉴 열기"
            aria-expanded="false"
            aria-controls="menu-drawer"
          >
            <span class="hamburger-lines" aria-hidden="true"
              ><span></span><span></span><span></span
            ></span>
          </button>
        </div>
      </div>
      <!-- 읽기 진행선 -->
      <div id="hdr-progress" class="hdr-progress" aria-hidden="true"></div>
    </div>

    <!-- 햄버거 드롭다운 메뉴 (항상 사용 가능한 메뉴 토글) -->
    <nav id="menu-drawer" class="menu-drawer" aria-label="메뉴" hidden>
      <a href="#" class="drawer-link" data-nav="about">소개</a>
      <a href="#" class="drawer-link" data-nav="blog">개발일지</a>
      <a href="dashboard.html" class="drawer-link" target="_blank" rel="noopener noreferrer">개발관리 대시보드</a>
      <button type="button" class="drawer-link" data-nav="search">검색</button>
    </nav>

    <!-- ② 핵심 이미지(낮) + 하단 오버레이 메뉴바 -->
    <div class="hero-banner">
      <img
        src="/img/코리요_온톨로지_낮.png"
        alt="화성특례시 도시데이터 관제센터 — 화성형 팔란티어"
      />
      <nav class="hero-menubar" aria-label="주요 메뉴">
        <div class="hdr-right">
          <a href="#" id="nav-about" class="hdr-link" data-nav="about">소개</a>
          <a href="#" id="nav-blog" class="hdr-link" data-nav="blog">개발일지</a>
          <button
            id="hdr-search-btn"
            class="hdr-iconbtn"
            type="button"
            aria-label="검색 열기"
            aria-expanded="false"
            data-nav="search"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <span class="hdr-divider" aria-hidden="true"></span>
          <a href="dashboard.html" id="nav-dashboard" class="hdr-dashboard-btn" target="_blank" rel="noopener noreferrer">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <span>대시보드</span>
          </a>
        </div>
      </nav>
    </div>

    <!-- 맨 위로 이동 버튼 (스크롤 시 노출, 모든 페이지 공통) -->
    <button id="scroll-top-fab" class="scroll-top-fab" type="button" aria-label="맨 위로 이동" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5" />
        <polyline points="6 11 12 5 18 11" />
      </svg>
    </button>

    <!-- 검색 패널 (기존 search() 재사용) -->
    <div id="hdr-search-panel" class="hdr-search-panel" hidden>
      <div class="hdr-search-inner">
        <label for="search-input" class="sr-only">검색어</label>
        <input type="text" id="search-input" placeholder="제목·카테고리 검색" />
        <button id="hdr-search-go" class="hdr-iconbtn" type="button" aria-label="검색 실행">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
    </div>

    <main class="container p-8 pb-4 w-full mx-auto max-w-[1190px] md:pt-[60px]">
      <!-- 블로그 포스트 리스트 영역 -->
      <div
        id="blog-posts"
        class="grid md:grid-cols-2 lg:grid-cols-3 gap-x-[25px] lg:gap-y-10 gap-y-4 mb-20"
      ></div>
      <!-- // 블로그 포스트 리스트 영역-->

      <!-- contents 영역 -->
      <div
        id="contents"
        class="mt-6 mb-28 grid-cols-3 max-w-[990px] mx-auto"
      ></div>
      <!-- // contents 영역-->

      <!-- pagination -->
      <div id="pagination"></div>
    </main>

    <!-- category 검색 영역 -->
    <section
      class="category-aside hidden md:flex flex-col border border-graylv2 bg-white rounded-[10px] fixed top-24 right-8 overflow-y-auto w-fit h-fit"
    >
      <header class="flex items-center">
        <h2 class="aside-tit sr-only text-sm font-semibold ml-5">content</h2>
      </header>
      <aside></aside>
    </section>
    <!-- // category 검색 영역 -->

    <!-- utils -->
    <script src="js/utils.js"></script>
    <!-- convert ipynb to html -->
    <script src="style/convertIpynbToHtml.js"></script>

    <!-- style -->
    <script src="style/globalStyle.js"></script>
    <script src="style/blogContentsStyle.js"></script>

    <!-- lender -->
    <script src="config.js"></script>
    <script src="js/URLparsing.js"></script>
    <script src="js/initData.js"></script>
    <script src="js/render.js"></script>

    <!-- 헤더 동작 (sticky 축소 · 읽기 진행선 · 검색 토글 · 현재 페이지 표시) -->
    <script src="js/header.js"></script>

    <!-- registry -->
    <script src="js/registry.js"></script>

    <!-- 접속통계 (일간/월간/연간) -->
    <script src="js/visitorStats.js"></script>
  </body>
</html>
